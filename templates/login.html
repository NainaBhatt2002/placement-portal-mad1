{% extends 'base.html' %}

{% block title %}Login Page{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-4 fw-bold">Log in to CareerConnect</h2>
                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <label class="form-label text-muted" for="username">Username or Email</label>
                            <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Enter your username" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted" for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
                        </div>
                        
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted">Don't have an account?</span> <a href="/register" class="text-decoration-none fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
