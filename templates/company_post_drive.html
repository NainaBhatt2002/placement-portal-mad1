{% extends 'base.html' %}

{% block title %}Post New Job{% endblock %}

{% block content %}
<div class="container-fluid py-4 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-white p-4 pb-0 border-0">
                    <h3 class="mb-0 text-primary">Post New Job Position</h3>
                    <p class="text-muted">Fill out the details below to create a new placement drive / job position.</p>
                </div>
                <div class="card-body p-4">
                    <form action="/company/drive/new" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Title *</label>
                            <input type="text" name="job_title" class="form-control" placeholder="e.g. Software Engineer" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Description *</label>
                            <textarea name="job_description" class="form-control" rows="4" placeholder="Describe the responsibilities and role" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Skills Required</label>
                                <input type="text" name="skills_required" class="form-control" placeholder="e.g. Python, Flask, React">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Experience Required</label>
                                <input type="text" name="experience_required" class="form-control" placeholder="e.g. 0-2 years, Fresher">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Salary Range / CTC</label>
                                <input type="text" name="salary_range" class="form-control" placeholder="e.g. 8-12 LPA">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Application Deadline *</label>
                                <input type="date" name="application_deadline" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="2" placeholder="e.g. Minimum 60% in B.Tech"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Submit Job Posting</button>
                            <a href="/company/dashboard" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
