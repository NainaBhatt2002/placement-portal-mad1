{% extends 'base.html' %}

{% block title %}Registration Page{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Join HireX</p>
                    </div>
                    
                    <form method="POST" action="/register" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted" for="role">Register As</label>
                            <select id="role" name="role" class="form-select form-select-lg" required>
                                <option value="" disabled selected>Select Role</option>
                                <option value="student">Student</option>
                                <option value="company">Company</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted" for="name">Full Name / Company Name</label>
                            <input type="text" id="name" name="name" class="form-control form-control-lg" placeholder="Enter your name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted" for="email">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted" for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Create a password" required>
                        </div>
                        
                        <div class="mb-4" id="resumeField" style="display: none;">
                            <label class="form-label text-muted" for="resume">Upload Resume (Optional, PDF only)</label>
                            <input type="file" id="resume" name="resume" class="form-control form-control-lg" accept=".pdf">
                        </div>
                        
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg">Register</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted">Already have an account?</span> <a href="/login" class="text-decoration-none fw-semibold">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('role').addEventListener('change', function() {
        if (this.value === 'student') {
            document.getElementById('resumeField').style.display = 'block';
        } else {
            document.getElementById('resumeField').style.display = 'none';
        }
    });
</script>
{% endblock %}
