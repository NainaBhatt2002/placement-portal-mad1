{% extends 'base.html' %}

{% block title %}Registration Page{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join the Classroom placement portal</p>
        </div>
        
        <form method="POST" action="/register">
            <div class="form-group">
                <label class="form-label" for="role">Register As</label>
                <select id="role" name="role" class="form-select" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="name">Full Name / Company Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
